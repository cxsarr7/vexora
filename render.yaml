services:
  - type: web
    name: vexora
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vexora-db
          property: connectionString

databases:
  - name: vexora-db
    plan: free
    region: oregon
    databaseName: vexora
    user: vexora
